default_install_hook_types:
- pre-commit
- commit-msg
repos:
- repo: https://github.com/trufflesecurity/trufflehog
  rev: v3.96.0
  hooks:
  - id: trufflehog
    name: TruffleHog secret scan
    description: No credential may be committed.
    entry: trufflehog filesystem --results=verified,unknown --fail --no-update --exclude-detectors=lob
    language: golang
    pass_filenames: true
    stages:
    - pre-commit
- repo: local
  hooks:
  - id: update-docs-supported-commands
    name: Update docs supported commands
    entry: python tools/update_docs_supported_commands.py
    language: python
    pass_filenames: false
    files: ^(setup\.py|tools/update_docs_supported_commands\.py|docs/supported_commands\.md|nvidia_tao_deploy/.+/(entrypoint|scripts)/.+\.py)$
    stages:
    - pre-commit
  - id: license-header
    name: license header
    description: Every source file must carry an SPDX license header.
    entry: python .github/hooks/check_license_header.py
    language: python
    files: \.(py|sh)$
    stages:
    - pre-commit
  - id: pylint
    name: pylint
    description: Static analysis, configured by .pylintrc.
    entry: pylint --rcfile .pylintrc
    language: system
    types:
    - python
    files: ^(nvidia_tao_deploy/)
    stages:
    - pre-commit
  - id: pydocstyle
    name: pydocstyle
    description: Docstring conventions.
    entry: pydocstyle --ignore=D4,D107,D200,D203,D205,D210,D211,D212,D213,D301,D400,D401 "--match=((?!_pb2).)*\.py"
    language: system
    types:
    - python
    files: ^(nvidia_tao_deploy/)
    stages:
    - pre-commit
  - id: flake8
    name: flake8
    description: Style and lint checks.
    entry: flake8 --ignore=E24,W504,E501 "--exclude=*_pb2.py"
    language: system
    types:
    - python
    files: ^(nvidia_tao_deploy/)
    stages:
    - pre-commit
  - id: dco-signoff
    name: DCO sign-off check
    description: Every commit must carry a Developer Certificate of Origin sign-off.
    entry: python .github/hooks/check_dco_signoff.py
    language: python
    stages:
    - commit-msg
